[project]
name = "agent-benchmarking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.8",
    "openai-agents>=0.1.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_advisor", "src/model_catalog", "src/model_qualification", "src/benchmark_engine", "src/scoring_agent", "src/sustainability_engine", "src/justification_agent"]

[tool.uv]
package = true
